services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: finpulse
      POSTGRES_USER: finpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - finpulse_data:/var/lib/postgresql/data
volumes:
  finpulse_data:
